<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Huis 62 – Holiday home. Our new website will be online from January 1, 2027.">
  <title>Huis 62 — Coming Soon</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

    :root {
      --white: #ffffff;
      --light: #f2f2f0;
      --soft: rgba(242, 242, 240, 0.88);
      --line: rgba(255, 255, 255, 0.42);
      --dark: #20211f;
      --accent: #d8d8d3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: var(--white);
      background: var(--light);
      font-family: "Inter", Arial, sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ---------------------------------------------------------
       HINTERGRUNDBILD
       Nur diese Datei muss später ersetzt/ergänzt werden:
       "huis62.jpg"
       --------------------------------------------------------- */
    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(
          120deg,
          rgba(22, 23, 21, 0.76),
          rgba(35, 36, 33, 0.52) 50%,
          rgba(22, 23, 21, 0.70)
        ),
        url("huis62.jpg") center center / cover no-repeat;
    }

    /* Weicher Schleier über dem Foto */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(
          circle at 50% 46%,
          rgba(255,255,255,0.07) 0%,
          rgba(255,255,255,0.00) 44%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.10),
          rgba(0,0,0,0.22)
        );
    }

    /* Sehr dezente Körnung für ein hochwertigeres Erscheinungsbild */
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E");
    }

    .content {
      position: relative;
      z-index: 10;
      width: min(900px, calc(100% - 48px));
      text-align: center;
      padding: 64px 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
      color: var(--soft);
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--line);
    }

    h1 {
      font-family: "Snell Roundhand", "Snell Roundhand Script", cursive;
      font-size: clamp(5.2rem, 14vw, 10rem);
      font-weight: 400;
      line-height: 0.78;
      letter-spacing: -0.045em;
      text-shadow: 0 2px 24px rgba(0,0,0,0.15);
    }

    .subtitle {
      margin-top: 30px;
      color: rgba(255,255,255,0.92);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.45rem, 3vw, 2.15rem);
      font-weight: 400;
      letter-spacing: 0.03em;
    }

    .divider {
      width: 56px;
      height: 1px;
      margin: 38px auto 30px;
      background: rgba(255,255,255,0.62);
    }

    .message {
      max-width: 570px;
      margin: 0 auto;
      color: rgba(255,255,255,0.82);
      font-size: 0.92rem;
      line-height: 1.9;
      letter-spacing: 0.025em;
    }

    .launch {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-top: 38px;
      padding: 17px 30px 15px;
      border: 1px solid rgba(255,255,255,0.34);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .launch-label {
      margin-bottom: 5px;
      color: rgba(255,255,255,0.60);
      font-size: 0.60rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .launch-date {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.35);
      padding-bottom: 2px;
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .footer a:hover,
    .footer a:focus-visible {
      color: rgba(255,255,255,0.9);
      border-color: rgba(255,255,255,0.8);
    }

    .footer {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 28px;
      display: flex;
      justify-content: center;
      color: rgba(255,255,255,0.52);
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* Subtile Einblendung beim Laden */
    .content {
      animation: reveal 1.3s ease-out both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .content {
        width: calc(100% - 28px);
        padding: 48px 10px;
      }

      .eyebrow {
        font-size: 0.56rem;
        letter-spacing: 0.23em;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 22px;
      }

      .message {
        font-size: 0.84rem;
        line-height: 1.8;
      }

      .launch {
        margin-top: 30px;
      }

      .footer {
        bottom: 18px;
        font-size: 0.52rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content" aria-label="Huis 62 – Coming Soon">
      <div class="eyebrow">Holiday Home</div>

      <h1>huis 62</h1>

      <p class="subtitle">A special place. Coming soon.</p>

      <div class="divider"></div>

      <p class="message">
        Our new website is currently under construction.
      </p>

      <div class="launch">
        <span class="launch-label">Our website launches on</span>
        <span class="launch-date">01.01.2027</span>
      </div>
    </section>

    <footer class="footer">
      Huis 62 &nbsp;·&nbsp; Coming Soon &nbsp;·&nbsp;
      <a href="https://sammlung-mueller.com/impressum.html" aria-label="Impressum">Impressum</a>
    </footer>
  </main>
</body>
</html>
